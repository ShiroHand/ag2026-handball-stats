name: 公式データ自動更新

on:
  schedule:
    # GitHub の定時実行は */N 形式や毎時0分が混雑で落とされやすいため、
    # 半端な分にずらし、さらに毎時の保険を別に置く。
    # JST 10:00〜翌2:00 のあいだ15分おき（UTC 01:00〜17:00）
    - cron: '4,19,34,49 1-17 * * *'
    # 保険: 毎時1回
    - cron: '52 * * * *'
  workflow_dispatch:        # 手動実行
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PDF解析ツールを導入
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: 公式リザルトAPIから取得
        run: node scripts/fetch-data.mjs

      - name: 公式PDFレポートを取り込み（7対6など）
        run: node scripts/fetch-reports.mjs || true

      - name: 国旗画像を取得（不足分のみ）
        run: node scripts/fetch-flags.mjs || true

      - name: 選手の顔写真を取得（不足分のみ）
        run: node scripts/fetch-photos.mjs || true

      - name: 差分があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/flags assets/photos
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ更新: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          fi
